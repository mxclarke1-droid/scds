<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Santa 3D Model Test</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0b1d33;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0,0,0,0.75);
            padding: 12px 16px;
            border-radius: 8px;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="status">🎅 Loading Santa...</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x0b1d33);


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.01,
        10000
    );

camera.position.set(
    0,
    1.5,
    6
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =========================
   LIGHTS
========================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        2.5
    );

scene.add(
    ambientLight
);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

keyLight.position.set(
    5,
    10,
    5
);

scene.add(
    keyLight
);


const fillLight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

fillLight.position.set(
    -5,
    4,
    -5
);

scene.add(
    fillLight
);


/* =========================
   MODEL FILE
========================= */

const MODEL_FILE =
    "santa_-_norad_santa_tracker.glb";


/* =========================
   LOAD SANTA
========================= */

const loader =
    new GLTFLoader();

loader.load(

    MODEL_FILE,

    function(gltf) {

        console.log(
            "🎅 SANTA MODEL LOADED!"
        );

        const santa =
            gltf.scene;


        /* ---------------------
           ADD MODEL
        --------------------- */

        scene.add(
            santa
        );


        /* ---------------------
           COUNT OBJECTS
        --------------------- */

        let meshes = 0;

        santa.traverse(
            function(object) {

                if (object.isMesh) {

                    meshes++;

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                }

            }
        );


        console.log(
            "Santa meshes:",
            meshes
        );


        /* ---------------------
           FIND SIZE
        --------------------- */

        const box =
            new THREE.Box3()
                .setFromObject(
                    santa
                );

        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        console.log(
            "Santa size:",
            size
        );


        /* ---------------------
           CENTER MODEL
        --------------------- */

        santa.position.sub(
            center
        );


        /* ---------------------
           SCALE MODEL
        --------------------- */

        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        if (largest > 0) {

            const targetSize = 4;

            const scale =
                targetSize /
                largest;

            santa.scale.setScalar(
                scale
            );

            console.log(
                "Santa scale:",
                scale
            );
        }


        /* ---------------------
           STATUS
        --------------------- */

        document.getElementById(
            "status"
        ).textContent =
            "🎅 Santa loaded!";

    },


    /* ---------------------
       PROGRESS
    --------------------- */

    function(xhr) {

        if (xhr.total) {

            const percent =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );

            document.getElementById(
                "status"
            ).textContent =
                "🎅 Loading Santa... " +
                percent +
                "%";

        }

    },


    /* ---------------------
       ERROR
    --------------------- */

    function(error) {

        console.error(
            "Santa loading error:",
            error
        );

        document.getElementById(
            "status"
        ).textContent =
            "❌ Santa failed to load";

    }

);


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
